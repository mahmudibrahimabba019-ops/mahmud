
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Security Awareness Demo</title>
  <style>
    body{font-family:system-ui;margin:40px;max-width:520px}
    .card{border:1px solid #ddd;border-radius:12px;padding:18px}
    label{display:block;margin-top:12px}
    input{width:100%;padding:10px;margin-top:6px}
    button{margin-top:14px;padding:10px 14px}
    .warn{margin-top:14px;padding:12px;border-radius:10px;background:#fff3cd;border:1px solid #ffeeba}
  </style>
</head>
<body>
  <h2>Security Awareness Demo</h2>
  <div class="card">
    <p>This page is a demo to teach phishing cues. It does not send or store anything.</p>

    <label>Email</label>
    <input id="email" type="email" placeholder="name@example.com" autocomplete="off">

    <label>Password</label>
    <input id="pw" type="password" placeholder="••••••••" autocomplete="off">

    <button id="btn">Sign in</button>

    <div id="msg" class="warn" style="display:none"></div>
  </div>

  <script>
    document.getElementById('btn').addEventListener('click', () => {
      // Never send/store credentials. Clear immediately.
      document.getElementById('email').value = '';
      document.getElementById('pw').value = '';

      const msg = document.getElementById('msg');
      msg.style.display = 'block';
      msg.textContent =
        'Demo complete: Real phishing pages try to collect what you typed. ' +
        'Always check the URL, domain spelling, and whether you expected this login prompt.';
    });
  </script>
</body>
</html>
