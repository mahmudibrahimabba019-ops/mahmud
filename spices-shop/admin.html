<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halari House - Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #F5E6D3;
            padding: 20px;
        }
        
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .dashboard {
            max-width: 1200px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: none;
        }
        
        h2 {
            color: #4A2C1A;
            margin-bottom: 20px;
            border-bottom: 2px solid #4A2C1A;
            padding-bottom: 10px;
        }
        
        h3 {
            color: #4A2C1A;
            margin: 15px 0;
        }
        
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        button {
            background-color: #4A2C1A;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        
        button:hover {
            background-color: #6B3F2A;
        }
        
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .nav-tab {
            padding: 10px 20px;
            background: #F5E6D3;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #4A2C1A;
            width: auto;
        }
        
        .nav-tab.active {
            background: #4A2C1A;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: #F5E6D3;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .card h4 {
            color: #4A2C1A;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .card .value {
            font-size: 24px;
            font-weight: bold;
            color: #4A2C1A;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th {
            background: #4A2C1A;
            color: white;
            padding: 12px;
            text-align: left;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #F5E6D3;
        }
        
        tr:hover {
            background: #F5E6D3;
        }
        
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .date-cell {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4A2C1A;
            font-weight: 600;
        }

        .cal-icon {
            width: 16px;
            height: 16px;
            display: inline-block;
            background: #F5E6D3;
            color: #4A2C1A;
            border-radius: 3px;
            padding: 2px;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.03) inset;
        }
        
        .status-paid { background: #d4edda; color: #155724; }
        .status-unpaid { background: #f8d7da; color: #721c24; }
        .status-pending { background: #fff3cd; color: #856404; }
        
        .error-message {
            color: #721c24;
            background: #f8d7da;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #4A2C1A;
        }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div class="login-container" id="loginForm">
        <h2>Halari House Admin</h2>
        <input type="text" id="username" placeholder="Username" value="halari_admin">
        <input type="password" id="password" placeholder="Password" value="spices2024">
        <button onclick="login()">Login</button>
        <div id="loginError" class="error-message" style="display: none;"></div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <h2>Halari House Admin Dashboard</h2>
        
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showTab('summary')">Dashboard</button>
            <button class="nav-tab" onclick="showTab('orders')">Orders</button>
            <button class="nav-tab" onclick="showTab('customers')">Customers</button>
            <button class="nav-tab" onclick="showTab('inventory')">Inventory</button>
            <button class="nav-tab" onclick="showTab('settings')">Settings</button>
        </div>

        <!-- Summary Tab -->
        <div id="summaryTab" class="tab-content active">
            <h3>Today's Overview</h3>
            <div class="summary-cards" id="summaryCards">
                <div class="card">
                    <h4>Loading...</h4>
                </div>
            </div>
            
            <h3>Recent Orders</h3>
            <div id="recentOrdersTable"></div>
        </div>

        <!-- Orders Tab -->
        <div id="ordersTab" class="tab-content">
            <h3>All Orders</h3>
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
                <button class="nav-tab" id="todayFilterBtn" onclick="applyTodayFilter()">Today</button>
                <div style="display:flex;gap:8px;align-items:center;">
                    <input type="date" id="fromDate" style="width:150px">
                    <input type="date" id="toDate" style="width:150px">
                    <button class="nav-tab" onclick="applyDateRange()">Filter</button>
                    <button class="nav-tab" onclick="clearDateFilters()">Clear</button>
                </div>
            </div>
            <div id="allOrdersTable"></div>
        </div>

        <!-- Customers Tab -->
        <div id="customersTab" class="tab-content">
            <h3>All Customers</h3>
            <div id="customersTable"></div>
        </div>

        <!-- Inventory Tab -->
        <div id="inventoryTab" class="tab-content">
            <h3>Inventory</h3>
            <div id="lowStockAlerts" style="margin-bottom:16px"></div>
            <div id="inventoryTable"></div>
        </div>

        <!-- Settings Tab -->
        <div id="settingsTab" class="tab-content">
            <h3>Settings</h3>
            <div style="max-width:480px;background:#F5E6D3;padding:18px;border-radius:8px;">
                <h4>Change Password</h4>
                <div id="changePwdMsg" style="margin-bottom:10px;display:none;padding:8px;border-radius:6px;"></div>
                <input type="password" id="currentPassword" placeholder="Current Password">
                <input type="password" id="newPassword" placeholder="New Password (min 6 chars)">
                <input type="password" id="confirmPassword" placeholder="Confirm New Password">
                <button onclick="changePassword()">Update Password</button>
            </div>
        </div>

        <!-- Order Details (hidden by default) -->
        <div id="orderDetails" style="display: none;">
            <button onclick="backToOrders()">← Back to Orders</button>
            <div id="orderDetailsContent"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8001';
        
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginError = document.getElementById('loginError');
            
            try {
                const response = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadSummary();
                    loadAllOrders();
                    loadCustomers();
                    loadInventory();
                } else {
                    loginError.style.display = 'block';
                    loginError.textContent = data.detail || 'Login failed';
                }
            } catch (error) {
                loginError.style.display = 'block';
                loginError.textContent = 'Cannot connect to server. Make sure API is running on port 8001';
                console.error(error);
            }
        }
        
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName + 'Tab').classList.add('active');
            
            // Update active button
            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        async function loadSummary() {
            try {
                const response = await fetch(`${API_URL}/admin/summary`);
                const data = await response.json();
                
                // Update summary cards
                document.getElementById('summaryCards').innerHTML = `
                    <div class="card">
                        <h4>Today's Orders</h4>
                        <div class="value">${data.total_orders_today}</div>
                    </div>
                    <div class="card">
                        <h4>Today's Sales</h4>
                        <div class="value">₦${data.total_sales_today.toLocaleString()}</div>
                    </div>
                    <div class="card">
                        <h4>Total Customers</h4>
                        <div class="value">${data.total_customers}</div>
                    </div>
                    <div class="card">
                        <h4>Pending Orders</h4>
                        <div class="value">${data.pending_orders}</div>
                    </div>
                `;
                
                // Update recent orders
                let recentHtml = '<table><tr><th>Order #</th><th>Date</th><th>Customer</th><th>Total</th><th>Status</th><th>Payment</th></tr>';
                data.recent_orders.forEach(order => {
                    recentHtml += `
                        <tr onclick="viewOrderDetails('${order.order_number}')" style="cursor: pointer;">
                            <td>${order.order_number}</td>
                            <td class="date-cell"><span class="cal-icon">📅</span>${formatDate(new Date(order.created_at))}</td>
                            <td>${order.customer}</td>
                            <td>₦${order.total.toLocaleString()}</td>
                            <td><span class="status-badge status-${order.status}">${order.status}</span></td>
                            <td><span class="status-badge status-${order.payment_status}">${order.payment_status}</span></td>
                        </tr>
                    `;
                });
                recentHtml += '</table>';
                document.getElementById('recentOrdersTable').innerHTML = recentHtml;
                
            } catch (error) {
                document.getElementById('summaryCards').innerHTML = '<div class="error-message">Failed to load summary</div>';
            }
        }
        
        function buildQuery(params) {
            const esc = encodeURIComponent;
            return Object.keys(params)
                .filter(k => params[k] !== undefined && params[k] !== null && params[k] !== '')
                .map(k => `${esc(k)}=${esc(params[k])}`)
                .join('&');
        }

        function formatDate(d) {
            if (!d || isNaN(d.getTime())) return '';
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            const datePart = d.toLocaleDateString(undefined, options);
            const timePart = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
            return `${datePart} - ${timePart}`;
        }

        async function loadAllOrders(fromDate = '', toDate = '', todayFlag = false) {
            try {
                const params = {};
                if (todayFlag) params.today = true;
                if (fromDate) params.from_date = fromDate;
                if (toDate) params.to_date = toDate;

                const q = buildQuery(params);
                const url = `${API_URL}/admin/orders${q ? '?' + q : ''}`;
                const response = await fetch(url);
                const data = await response.json();

                let html = '<table><tr><th>Order #</th><th>Date</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Payment</th></tr>';
                data.orders.forEach(order => {
                    html += `
                        <tr onclick="viewOrderDetails('${order.order_number}')" style="cursor: pointer;">
                            <td>${order.order_number}</td>
                            <td class="date-cell"><span class="cal-icon">📅</span>${formatDate(new Date(order.created_at))}</td>
                            <td>${order.customer_name}</td>
                            <td>${order.customer_phone}</td>
                            <td>₦${order.total_amount.toLocaleString()}</td>
                            <td><span class="status-badge status-${order.status}">${order.status}</span></td>
                            <td><span class="status-badge status-${order.payment_status}">${order.payment_status}</span></td>
                        </tr>
                    `;
                });
                html += '</table>';
                document.getElementById('allOrdersTable').innerHTML = html;

            } catch (error) {
                document.getElementById('allOrdersTable').innerHTML = '<div class="error-message">Failed to load orders</div>';
            }
        }
        
        async function loadCustomers() {
            try {
                const response = await fetch(`${API_URL}/admin/customers`);
                const data = await response.json();
                
                let html = '<table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Total Spent</th></tr>';
                data.customers.forEach(customer => {
                    html += `
                        <tr>
                            <td>${customer.name}</td>
                            <td>${customer.email}</td>
                            <td>${customer.phone}</td>
                            <td>${customer.total_orders}</td>
                            <td>₦${customer.total_spent.toLocaleString()}</td>
                        </tr>
                    `;
                });
                html += '</table>';
                document.getElementById('customersTable').innerHTML = html;
                
            } catch (error) {
                document.getElementById('customersTable').innerHTML = '<div class="error-message">Failed to load customers</div>';
            }
        }

        async function loadInventory() {
            try {
                const resp = await fetch(`${API_URL}/products`);
                const products = await resp.json();

                // low stock alerts
                const low = products.filter(p => Number(p.stock_quantity ?? 100) < (Number(p.low_stock_threshold ?? 10)));
                if (low.length) {
                    let alertHtml = '<div class="card"><h4>Low Stock Alerts</h4>';
                    low.forEach(p => { alertHtml += `<div style="color:#fd7e14">⚠️ ${p.name} — ${p.stock_quantity} left</div>` });
                    alertHtml += '</div>';
                    document.getElementById('lowStockAlerts').innerHTML = alertHtml;
                } else {
                    document.getElementById('lowStockAlerts').innerHTML = '';
                }

                // inventory table
                let html = '<table><tr><th>Product</th><th>Stock</th><th>Controls</th></tr>';
                products.forEach(p => {
                    const q = Number(p.stock_quantity ?? 100);
                    let color = '#28a745';
                    if (q === 0) color = '#dc3545';
                    else if (q < 10) color = '#fd7e14';

                    html += `
                        <tr>
                            <td>${p.name}</td>
                            <td><span style="color:${color};font-weight:bold">${q}</span></td>
                            <td>
                                <button onclick="adjustStock(${p.id}, 1)">+1</button>
                                <button onclick="adjustStock(${p.id}, 10)">+10</button>
                                <button onclick="adjustStock(${p.id}, -1)">-1</button>
                                <button onclick="adjustStock(${p.id}, -10)">-10</button>
                                <input id="set-${p.id}" type="number" placeholder="Set" style="width:80px;margin-left:8px">
                                <button onclick="setStock(${p.id})">Set</button>
                            </td>
                        </tr>
                    `;
                });
                html += '</table>';
                document.getElementById('inventoryTable').innerHTML = html;
            } catch (e) {
                document.getElementById('inventoryTable').innerHTML = '<div class="error-message">Failed to load inventory</div>';
            }
        }

        async function adjustStock(productId, delta) {
            try {
                const resp = await fetch(`${API_URL}/admin/products/${productId}/stock`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ delta })
                });
                if (!resp.ok) throw new Error('Failed');
                await loadInventory();
            } catch (e) { alert('Could not update stock'); }
        }

        async function setStock(productId) {
            const input = document.getElementById(`set-${productId}`);
            const v = Number(input.value || 0);
            if (isNaN(v)) return; 
            try {
                const resp = await fetch(`${API_URL}/admin/products/${productId}/stock`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ set: v })
                });
                if (!resp.ok) throw new Error('Failed');
                await loadInventory();
            } catch (e) { alert('Could not set stock'); }
        }
        
        async function viewOrderDetails(orderNumber) {
            try {
                // Extract order ID from order number (you might need to adjust this)
                const response = await fetch(`${API_URL}/admin/orders?order_number=${orderNumber}`);
                const orders = await response.json();
                const order = orders.orders.find(o => o.order_number === orderNumber);
                
                if (!order) return;
                
                const orderResponse = await fetch(`${API_URL}/admin/orders/${order.order_id}`);
                const details = await orderResponse.json();
                
                let itemsHtml = '';
                details.items.forEach(item => {
                    itemsHtml += `<tr><td>${item.product_name}</td><td>${item.quantity}</td><td>₦${item.price}</td><td>₦${item.subtotal}</td></tr>`;
                });
                
                document.getElementById('orderDetailsContent').innerHTML = `
                    <h3>Order ${details.order_number}</h3>
                    <p class="date-cell"><span class="cal-icon">📅</span>${formatDate(new Date(details.created_at))}</p>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div>
                            <h4>Customer Information</h4>
                            <p><strong>Name:</strong> ${details.customer.name}</p>
                            <p><strong>Email:</strong> ${details.customer.email}</p>
                            <p><strong>Phone:</strong> ${details.customer.phone}</p>
                        </div>
                        <div>
                            <h4>Delivery Address</h4>
                            <p>${details.delivery.address}</p>
                            <p>${details.delivery.city}, ${details.delivery.state}</p>
                            <p><strong>Phone:</strong> ${details.delivery.phone}</p>
                            <p><strong>Note:</strong> ${details.delivery.note || 'None'}</p>
                        </div>
                    </div>
                    
                    <h4>Order Items</h4>
                    <table>
                        <tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr>
                        ${itemsHtml}
                        <tr>
                            <td colspan="3" style="text-align: right;"><strong>Subtotal:</strong></td>
                            <td>₦${details.subtotal}</td>
                        </tr>
                        <tr>
                            <td colspan="3" style="text-align: right;"><strong>Delivery:</strong></td>
                            <td>₦${details.delivery_fee}</td>
                        </tr>
                        <tr>
                            <td colspan="3" style="text-align: right;"><strong>Total:</strong></td>
                            <td>₦${details.total_amount}</td>
                        </tr>
                    </table>
                    
                    <div style="margin-top: 20px;">
                        <h4>Update Status</h4>
                        <select id="statusSelect">
                            <option value="pending" ${details.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="processing" ${details.status === 'processing' ? 'selected' : ''}>Processing</option>
                            <option value="shipped" ${details.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                            <option value="delivered" ${details.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                            <option value="cancelled" ${details.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                        
                        <select id="paymentSelect">
                            <option value="unpaid" ${details.payment_status === 'unpaid' ? 'selected' : ''}>Unpaid</option>
                            <option value="paid" ${details.payment_status === 'paid' ? 'selected' : ''}>Paid</option>
                            <option value="failed" ${details.payment_status === 'failed' ? 'selected' : ''}>Failed</option>
                            <option value="refunded" ${details.payment_status === 'refunded' ? 'selected' : ''}>Refunded</option>
                        </select>
                        
                        <button onclick="updateOrderStatus(${order.order_id})">Update Status</button>
                        <button id="refundBtn" onclick="processRefund(${order.order_id})" data-order-number="${details.order_number}" data-total-amount="${details.total_amount}" style="display: ${details.payment_status === 'paid' ? 'inline-block' : 'none'}; background-color: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-left: 10px;">Process Refund</button>
                    </div>
                `;
                
                // Hide tabs and show order details
                document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
                document.getElementById('orderDetails').style.display = 'block';
                
            } catch (error) {
                alert('Failed to load order details');
                console.error(error);
            }
        }
        
        async function updateOrderStatus(orderId) {
            const status = document.getElementById('statusSelect').value;
            const payment_status = document.getElementById('paymentSelect').value;
            
            try {
                const response = await fetch(`${API_URL}/admin/orders/${orderId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status, payment_status })
                });
                
                if (response.ok) {
                    alert('Order updated successfully!');
                    backToOrders();
                    loadSummary();
                    loadAllOrders();
                } else {
                    alert('Failed to update order');
                }
            } catch (error) {
                alert('Error updating order');
            }
        }
        
        async function processRefund(orderId) {
            const btn = event.target;
            const orderNumber = btn.getAttribute('data-order-number');
            const totalAmount = btn.getAttribute('data-total-amount');
            
            if (!confirm(`Are you sure you want to refund order #${orderNumber} for ₦${totalAmount}? This will cancel the order and restore stock. This cannot be undone.`)) {
                return;
            }
            
            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = 'Processing refund...';
            
            try {
                const response = await fetch(`${API_URL}/admin/orders/${orderId}/refund`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    alert('Refund processed successfully! Stock has been restored.');
                    backToOrders();
                    loadSummary();
                    loadAllOrders();
                } else {
                    const errorData = await response.json();
                    alert('Refund failed: ' + (errorData.detail || 'Unknown error'));
                }
            } catch (error) {
                alert('Error processing refund: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }
        
        function backToOrders() {
            document.getElementById('orderDetails').style.display = 'none';
            document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = '');
            showTab('orders');
        }

        // Filters
        function applyTodayFilter() {
            document.getElementById('fromDate').value = '';
            document.getElementById('toDate').value = '';
            loadAllOrders('', '', true);
        }

        function applyDateRange() {
            const from = document.getElementById('fromDate').value;
            const to = document.getElementById('toDate').value;
            loadAllOrders(from, to, false);
        }

        function clearDateFilters() {
            document.getElementById('fromDate').value = '';
            document.getElementById('toDate').value = '';
            loadAllOrders();
        }

        // Change password
        async function changePassword() {
            const cur = document.getElementById('currentPassword').value.trim();
            const nw = document.getElementById('newPassword').value.trim();
            const cf = document.getElementById('confirmPassword').value.trim();
            const msg = document.getElementById('changePwdMsg');
            msg.style.display = 'none';

            if (!cur || !nw || !cf) {
                msg.style.display = 'block'; msg.style.background = '#f8d7da'; msg.style.color = '#721c24'; msg.textContent = 'All fields are required';
                return;
            }
            if (nw.length < 6) {
                msg.style.display = 'block'; msg.style.background = '#f8d7da'; msg.style.color = '#721c24'; msg.textContent = 'New password must be at least 6 characters';
                return;
            }
            if (nw !== cf) {
                msg.style.display = 'block'; msg.style.background = '#f8d7da'; msg.style.color = '#721c24'; msg.textContent = 'New passwords do not match';
                return;
            }

            try {
                const resp = await fetch(`${API_URL}/admin/change-password`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ current_password: cur, new_password: nw })
                });
                const data = await resp.json();
                if (resp.ok) {
                    msg.style.display = 'block'; msg.style.background = '#d4edda'; msg.style.color = '#155724'; msg.textContent = data.message || 'Password updated successfully!';
                    document.getElementById('currentPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                } else {
                    msg.style.display = 'block'; msg.style.background = '#f8d7da'; msg.style.color = '#721c24'; msg.textContent = data.detail || 'Failed to update password';
                }
            } catch (e) {
                msg.style.display = 'block'; msg.style.background = '#f8d7da'; msg.style.color = '#721c24'; msg.textContent = 'Could not connect to server';
            }
        }
    </script>
</body>
</html>
