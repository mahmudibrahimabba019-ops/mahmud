<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - Halari Seasonings</title>
    <style>
        :root {
            --cream: #F5E6D3;
            --brown: #4A2C1A;
            --brown-dark: #2e1a10;
            --white: #FFFFFF;
            --shadow: rgba(74, 44, 26, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--cream) 0%, #efe1cf 100%);
            font-family: Arial, Helvetica, sans-serif;
            color: var(--brown);
            padding: 24px;
        }

        .maintenance-wrap {
            width: min(100%, 760px);
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(74, 44, 26, 0.14);
            border-radius: 24px;
            box-shadow: 0 20px 45px var(--shadow);
            padding: 42px 28px;
            text-align: center;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
        }

        .logo img {
            width: 92px;
            height: 92px;
            object-fit: contain;
            border-radius: 50%;
            background: var(--white);
            padding: 8px;
            box-shadow: 0 8px 18px rgba(74, 44, 26, 0.10);
        }

        .brand {
            margin: 0;
            font-size: clamp(1.75rem, 3vw, 2.75rem);
            letter-spacing: 0.08em;
            font-weight: 700;
            color: var(--brown);
        }

        .message {
            margin: 18px auto 0;
            max-width: 620px;
            font-size: clamp(1.1rem, 2vw, 1.6rem);
            line-height: 1.6;
            color: var(--brown-dark);
            font-weight: 600;
        }

        .tag {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 16px;
            border-radius: 999px;
            background: var(--brown);
            color: var(--cream);
            font-size: 0.9rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .maintenance-wrap {
                padding: 28px 18px;
                border-radius: 18px;
            }

            .logo img {
                width: 72px;
                height: 72px;
            }

            .brand {
                letter-spacing: 0.05em;
            }
        }
    </style>
</head>
<body>
    <main class="maintenance-wrap" aria-live="polite">
        <div class="logo" aria-label="Halari logo">
            <img src="https://halari-backend.onrender.com/images/halari.jpg" alt="Halari logo">
        </div>
        <h1 class="brand">HALARI</h1>
        <p class="message">We're currently making improvements to serve you better. Please check back shortly!</p>
        <div class="tag">Temporary Maintenance</div>
    </main>
</body>
</html>
