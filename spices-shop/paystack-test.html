<!DOCTYPE html>
<html>
<head>
    <title>Paystack Test - Halari House</title>
    <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body style="font-family: Arial; text-align: center; padding: 50px; background: #F5E6D3;">
    <div style="max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px;">
        <h2 style="color: #4A2C1A;">Paystack Test</h2>
        <p>Click the button to test if Paystack popup works</p>
        <button onclick="testPaystack()" style="background: #4A2C1A; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer;">
            Test Paystack Popup
        </button>
        <div id="result" style="margin-top: 20px;"></div>
    </div>
    
    <script>
    function testPaystack() {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = 'Loading Paystack...';
        
        console.log('Testing Paystack...');
        
        // Check if Paystack loaded
        if (typeof PaystackPop === 'undefined') {
            resultDiv.innerHTML = '❌ Paystack not loaded! Check internet connection.';
            console.error('PaystackPop is undefined');
            return;
        }
        
        resultDiv.innerHTML = '✅ Paystack loaded! Opening popup...';
        
        // Open Paystack popup
        const handler = PaystackPop.setup({
            key: 'pk_test_abd78fdac041a5a82085a0aa0b504171b5a6f7d5',
            email: 'test@halarihouse.com',
            amount: 5000,
            currency: 'NGN',
            callback: function(response) {
                resultDiv.innerHTML = '✅ Payment successful! Reference: ' + response.reference;
                console.log('Payment success:', response);
            },
            onClose: function() {
                resultDiv.innerHTML = '⚠️ Payment window closed';
                console.log('Payment window closed');
            }
        });
        
        handler.openIframe();
        console.log('Paystack iframe opened');
    }
    </script>
</body>
</html>
